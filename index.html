<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbf9">
  <meta name="description" content="Roadbook autónomo do Caminho Português da Costa, pronto para incorporar no Notion.">
  <title>Roadbook · Caminho Português da Costa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
:root {
  --paper: #fbfbf9;
  --surface: #fff;
  --ink: #101b18;
  --muted: #5e6863;
  --faint: #8d9690;
  --line: #dfe5e0;
  --pine: #0c593f;
  --pine-soft: #e9f2ed;
  --pine-faint: #f4f8f5;
  --gold: #bd8b2c;
  --amber: #c98300;
  --amber-soft: #fff6df;
  --blue: #0b63b6;
  --blue-soft: #edf5fd;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 14px/1.45 "DM Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
img { display: block; max-width: 100%; }
a { color: inherit; }
button { color: inherit; font: inherit; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.load-state { margin: 40px 0; color: var(--muted); }
.load-error {
  width: min(520px, calc(100% - 32px));
  margin: 12vh auto 0;
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  text-align: center;
}
.load-error > div { color: var(--amber); font-size: 28px; }
.load-error h1 { margin: 8px 0; font: 700 32px/1 "Barlow Condensed", Impact, sans-serif; text-transform: uppercase; }
.load-error p { margin: 0; color: var(--muted); }
.load-error button {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 40px;
  margin-top: 18px;
  padding: 8px 14px;
  border: 0;
  border-radius: 999px;
  background: var(--pine);
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}

.roadbook { width: min(1240px, calc(100% - 48px)); margin: 0 auto; padding: 36px 0 24px; }
.masthead { padding: 4px 0 20px; }
.title-block h1 {
  margin: 0;
  color: var(--ink);
  font-family: "Barlow Condensed", Impact, sans-serif;
  font-size: clamp(56px, 7vw, 96px);
  font-weight: 700;
  letter-spacing: .015em;
  line-height: .86;
  text-transform: uppercase;
}
.title-block p { margin: 16px 0 0; font-size: 17px; font-weight: 500; }
.title-block p span { color: var(--muted); }

.quick-nav {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  margin: 0 0 20px;
  padding: 8px 0;
  background: var(--paper);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  scrollbar-width: none;
}
.quick-nav::-webkit-scrollbar { display: none; }
.quick-nav a, .quick-nav button {
  flex: 0 0 auto;
  padding: 5px 9px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  text-decoration: none;
}
.quick-nav button { display: inline-flex; align-items: center; gap: 5px; margin-left: auto; cursor: pointer; }
.quick-nav a:hover, .quick-nav a:focus-visible, .quick-nav button:hover, .quick-nav button:focus-visible { background: var(--pine-soft); color: var(--pine); outline: none; }
.quick-nav button[aria-expanded="true"] { background: var(--pine-soft); color: var(--pine); }

.trip-summary {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin: 0 0 24px;
}
.summary-item {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--surface);
}
.summary-item > i { flex: 0 0 auto; color: var(--pine); font-size: 18px; }
.summary-item span { display: block; color: var(--muted); font-size: 11px; }
.summary-item strong { display: block; margin-top: 1px; font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
.section-rule { margin: 0; border: 0; border-top: 1px solid var(--line); }

.table-scroll { overflow-x: clip; }
.roadbook-table { width: 100%; min-width: 0; table-layout: fixed; border-collapse: collapse; }
.roadbook-table col:nth-child(1) { width: 64px; }
.roadbook-table col:nth-child(2) { width: 13%; }
.roadbook-table col:nth-child(3) { width: 32%; }
.roadbook-table col:nth-child(4) { width: 16%; }
.roadbook-table col:nth-child(5) { width: auto; }
.roadbook-table th {
  padding: 14px 10px 10px;
  color: var(--ink);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .06em;
  text-align: left;
  text-transform: uppercase;
}
.roadbook-table th:first-child, .roadbook-table td:first-child { padding-left: 8px; }
.roadbook-table th:last-child, .roadbook-table td:last-child { padding-right: 8px; }
.roadbook-table td { padding: 10px; border-top: 1px solid var(--line); vertical-align: middle; }
.itinerary-row { cursor: pointer; scroll-margin-top: 56px; }
.itinerary-row > td { transition: background-color .15s ease; }
.itinerary-row:hover > td, .itinerary-row[aria-expanded="true"] > td, .itinerary-row:target > td { background: var(--pine-faint); }
.itinerary-row.highlighted > td { box-shadow: inset 0 2px 0 var(--gold), inset 0 -2px 0 var(--gold); }
.itinerary-row:focus-visible > td { outline: 2px solid var(--pine); outline-offset: -2px; }
.stage-detail-row[hidden] { display: none; }
.stage-detail-row > td { padding: 0; background: var(--pine-faint); }
.stage-detail {
  display: grid;
  grid-template-columns: minmax(260px, .9fr) minmax(0, 1.1fr);
  gap: 16px;
  padding: 14px 18px 18px 58px;
  border-top: 1px dashed #cbd9cf;
}
.stage-map {
  min-height: 260px;
  width: 100%;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #dcecf0;
}
.map-empty { display: grid; place-items: center; min-height: inherit; color: var(--muted); font-size: 12px; }
.stage-detail-content { min-width: 0; }
.detail-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.detail-item { min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.detail-label, .detail-section-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.detail-label i, .detail-section-label i { color: var(--pine); font-size: 14px; }
.detail-item strong { display: block; margin-top: 4px; font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
.detail-accommodation {
  margin-top: 10px;
  padding: 11px 13px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
}
.detail-accommodation-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.detail-accommodation-status { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
.detail-accommodation-status i { font-size: 15px; }
.detail-accommodation-status.confirmed { color: var(--pine); }
.detail-accommodation-status.candidate { color: var(--amber); }
.detail-accommodation-status.required { color: var(--blue); }
.detail-accommodation-status.open { color: var(--muted); }
.detail-accommodation-main { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding: 10px 0 8px; }
.detail-accommodation-copy { min-width: 0; }
.detail-accommodation-copy strong { display: block; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.detail-accommodation-copy > span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
.detail-price { flex: 0 0 auto; padding-left: 16px; border-left: 1px solid var(--line); text-align: right; }
.detail-price .detail-label { justify-content: flex-end; }
.detail-price strong { display: block; margin-top: 2px; font: 600 14px "DM Mono", monospace; }
.detail-accommodation-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; min-height: 21px; }
.detail-link, .detail-muted { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
.detail-link { color: var(--pine); font-weight: 700; text-decoration: none; }
.detail-muted { color: var(--faint); }
.detail-link:hover, .detail-link:focus-visible { text-decoration: underline; outline: none; }
.meta-pairs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px 12px; margin-top: 8px; }
.meta-pair { min-width: 0; color: var(--muted); font-size: 11px; }
.meta-pair strong { display: block; color: var(--ink); font-size: 11px; font-weight: 600; overflow-wrap: anywhere; }
.meta-pair a { color: var(--pine); font-weight: 600; }

.detail-route, .detail-extra, .detail-points { display: flex; align-items: flex-start; gap: 7px; color: var(--muted); line-height: 1.45; }
.detail-route { margin: 10px 0 0; font-size: 11px; }
.detail-extra { margin: 9px 0 0; font-size: 12px; }
.detail-points { margin: 10px 0 0; font-size: 11px; }
.detail-route > i, .detail-extra > i, .detail-points > i { flex: 0 0 auto; margin-top: 2px; color: var(--pine); font-size: 14px; }
.detail-route strong, .detail-extra strong, .detail-points strong { color: var(--ink); }
.detail-sections { display: grid; gap: 10px; margin-top: 12px; }
.detail-section { padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.detail-section-title { margin: 0 0 8px; }
.timeline { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
.timeline-item { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 11px; }
.timeline-time { color: var(--pine); font: 600 11px "DM Mono", monospace; }
.timeline-place { font-weight: 600; }
.timeline-label, .compact-item-detail { color: var(--muted); }
.compact-list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
.compact-item { display: flex; align-items: flex-start; gap: 8px; font-size: 11px; }
.compact-item > i { flex: 0 0 auto; margin-top: 2px; color: var(--pine); font-size: 14px; }
.compact-item-main { min-width: 0; }
.compact-item-main strong { font-weight: 600; }
.compact-item-main small { display: block; margin-top: 2px; color: var(--muted); }
.compact-item-main a { color: var(--pine); font-weight: 600; }
.warning-list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
.warning { display: flex; align-items: flex-start; gap: 8px; padding: 8px 9px; border-left: 3px solid var(--amber); background: var(--amber-soft); font-size: 11px; }
.warning.high { border-left-color: #a82d1e; background: #fff0ed; }
.warning.low { border-left-color: var(--pine); background: var(--pine-soft); }
.warning i { color: var(--amber); font-size: 14px; }
.warning.high i { color: #a82d1e; }
.warning.low i { color: var(--pine); }
.escape-panel { border-color: #c9dcef; background: var(--blue-soft); }
.escape-panel .detail-section-label i { color: var(--blue); }
.elevation-profile { width: 100%; margin-top: 8px; border: 1px solid var(--line); }
.luggage-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.luggage-grid > div > strong { display: block; margin-top: 4px; font-size: 11px; font-weight: 600; overflow-wrap: anywhere; }
.luggage-status { color: var(--pine); font-weight: 700; }

.day-number { display: inline-flex; align-items: center; justify-content: center; gap: 1px; min-width: 44px; height: 34px; padding: 0 6px; border: 0; border-radius: 999px; background: var(--pine); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; }
.day-number i { font-size: 15px; transition: transform .15s ease; }
.day-number[aria-expanded="true"] i { transform: rotate(180deg); }
.day-number:hover, .day-number:focus-visible { background: #087653; outline: 2px solid var(--pine); outline-offset: 2px; }
.day-number.prep { background: var(--pine-faint); color: var(--pine); border: 1px solid #cfe0d5; }
.date { font-size: 13px; font-weight: 600; text-transform: uppercase; }
.date small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; font-weight: 400; text-transform: none; }
.stage { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.stage-note { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; font-weight: 400; }
.today-badge { display: inline-flex; margin-left: 7px; padding: 2px 5px; border-radius: 999px; background: #f8efd7; color: #8b651d; font-size: 9px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; vertical-align: 2px; }
.distance { font: 12px "DM Mono", monospace; }
.accommodation strong { display: block; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.accommodation span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }

.lower-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 14px; align-items: start; }
.map-panel, .budget-panel { min-width: 0; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); overflow: hidden; }
.panel-title { margin: 0; padding: 12px 15px 9px; font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.panel-body { padding: 0 15px 12px; }
.map-panel .panel-body { padding: 0; }
#roadbook-map { height: 330px; width: 100%; background: #dcecf0; }
.leaflet-container { font: 11px "DM Sans", sans-serif; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--ink); }
.leaflet-popup-content { margin: 10px 12px; font-size: 12px; }
.leaflet-control-attribution { font-size: 9px; }
.map-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 10px; padding: 8px 12px; border-top: 1px solid var(--line); }
.map-footer a { display: inline-flex; align-items: center; gap: 6px; color: var(--pine); font-size: 12px; font-weight: 700; text-decoration: none; }
.map-footer a:hover, .map-footer a:focus-visible { text-decoration: underline; outline: none; }
.map-footer span, .map-footer .map-source { color: var(--muted); font-size: 10px; font-weight: 600; }
.budget-list, .contact-list, .checklist { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.budget-note { margin: 0 0 8px; color: var(--faint); font-size: 10px; }
.budget-row { display: flex; justify-content: space-between; gap: 14px; color: var(--muted); font-size: 12px; }
.budget-row > span { min-width: 0; }
.budget-row small { display: block; margin-top: 2px; color: var(--faint); font-size: 10px; }
.budget-row strong { color: var(--ink); font: 12px "DM Mono", monospace; text-align: right; white-space: nowrap; }
.budget-total { margin: 10px -15px -12px; padding: 9px 15px; border-top: 1px solid var(--line); background: var(--pine-faint); }
.budget-total .budget-row { color: var(--ink); font-weight: 600; }
.budget-total strong { font-size: 15px; font-weight: 700; }
.support-panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
.support-panel { min-width: 0; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); }
.contact-item, .check-item { display: flex; align-items: flex-start; gap: 8px; color: var(--muted); font-size: 12px; }
.contact-item i, .check-item i { flex: 0 0 auto; color: var(--pine); font-size: 15px; }
.contact-item strong { display: block; color: var(--ink); }
.contact-item a { color: var(--pine); font-weight: 700; text-decoration: none; }
.check-item span { color: var(--ink); }
.roadbook-footer { display: flex; justify-content: space-between; gap: 20px; margin: 14px 10px 0; color: var(--muted); font-size: 11px; }
.footer-mark { color: var(--pine); font-weight: 700; }

@media (max-width: 980px) {
  .roadbook { width: min(calc(100% - 32px), 740px); }
  .trip-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .roadbook-table th, .roadbook-table td { padding-right: 6px; padding-left: 6px; }
  .roadbook-table th { font-size: 10px; }
  .roadbook-table td { font-size: 12px; }
  .stage { font-size: 13px; }
  .stage-note, .accommodation span { font-size: 10px; }
  .accommodation strong { font-size: 12px; }
  .distance { white-space: normal; }
  .stage-detail { grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); padding-left: 30px; }
  #roadbook-map { height: 300px; }
}
@media (max-width: 640px) {
  .roadbook { width: calc(100% - 24px); padding-top: 18px; }
  .title-block h1 { font-size: clamp(48px, 15vw, 62px); }
  .title-block p { font-size: 14px; }
  .quick-nav { margin-bottom: 16px; }
  .quick-nav button { margin-left: 4px; }
  .trip-summary { gap: 8px; margin-bottom: 18px; }
  .summary-item { padding: 9px; }
  .summary-item span { font-size: 10px; }
  .summary-item strong { font-size: 11px; }
  .table-scroll { overflow: visible; }
  .roadbook-table, .roadbook-table tbody { display: block; }
  .roadbook-table colgroup { display: none; }
  .roadbook-table thead { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .itinerary-row {
    display: grid;
    grid-template-columns: 48px minmax(0, 1fr) auto;
    gap: 2px 9px;
    margin-top: 10px;
    padding: 11px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--surface);
  }
  .itinerary-row > td { display: block; padding: 0; border: 0; background: transparent !important; }
  .itinerary-row > td:nth-child(1) { grid-column: 1; grid-row: 1 / span 2; align-self: center; }
  .itinerary-row > td:nth-child(2) { grid-column: 2; grid-row: 1; }
  .itinerary-row > td:nth-child(3) { grid-column: 2; grid-row: 2; }
  .itinerary-row > td:nth-child(4) { grid-column: 3; grid-row: 1; text-align: right; }
  .itinerary-row > td:nth-child(5) { grid-column: 1 / -1; grid-row: 3; margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); }
  .itinerary-row[aria-expanded="true"] { border-color: #bfd3c6; border-bottom-right-radius: 0; border-bottom-left-radius: 0; background: var(--pine-faint); }
  .itinerary-row.highlighted { box-shadow: inset 3px 0 0 var(--gold); }
  .itinerary-row.highlighted > td { box-shadow: none; }
  .date { font-size: 11px; }
  .date small { display: inline; margin-left: 4px; }
  .stage { font-size: 13px; }
  .distance { color: var(--pine); font-size: 10px; font-weight: 600; }
  .accommodation strong { font-size: 12px; }
  .accommodation span { display: inline; margin: 0 0 0 5px; }
  .stage-detail-row:not([hidden]), .stage-detail-row:not([hidden]) > td { display: block; }
  .stage-detail-row > td { border: 1px solid #bfd3c6; border-top: 0; border-radius: 0 0 7px 7px; }
  .stage-detail { grid-template-columns: 1fr; padding: 12px; border-top: 0; }
  .stage-detail-content { order: -1; }
  .detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .detail-accommodation-main { gap: 12px; }
  .detail-accommodation-actions { justify-content: flex-start; }
  .meta-pairs, .luggage-grid { grid-template-columns: 1fr 1fr; }
  .stage-map { min-height: 220px; }
  #roadbook-map { height: 330px; }
  .support-panels { grid-template-columns: 1fr; }
  .roadbook-footer { display: block; margin-top: 18px; }
  .roadbook-footer .footer-mark { display: block; margin-top: 6px; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}

@media print {
  @page { margin: 14mm; }
  body { background: #fff; color: #000; }
  .roadbook { width: 100%; padding: 0; }
  .quick-nav, .leaflet-control-zoom { display: none !important; }
  .masthead { padding-top: 0; }
  .summary-item, .detail-item, .detail-accommodation, .detail-section, .map-panel, .budget-panel, .support-panel { box-shadow: none; }
  .stage-detail-row[hidden] { display: table-row !important; }
  .stage-detail-row > td, .stage-detail { background: #fff; }

  <script>
const roadbookElement = document.getElementById("roadbook");
const stageMaps = new Map();

let expandedBeforePrint = [];

const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (character) => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#039;"
})[character]);
const safeClass = (value) => String(value ?? "").toLowerCase().replace(/[^a-z0-9_-]/gi, "");
const icon = (name) => `<i class="${safeClass(name)}" aria-hidden="true"></i>`;
const hasValue = (value) => value !== null && value !== undefined && value !== "";
const asArray = (value) => Array.isArray(value) ? value : [];
const isCoordinate = (point) => Array.isArray(point) && point.length >= 2 && Number.isFinite(point[0]) && Number.isFinite(point[1]);
const toFiniteNumber = (value) => {
  if (!hasValue(value)) return null;
  const number = Number(value);
  return Number.isFinite(number) ? number : null;
};
const normaliseStatus = (value) => String(value ?? "").toLowerCase();
const statusInfo = (row, value = null) => {
  const raw = value || row.accommodation?.status || row.state?.label || "";
  const normalised = normaliseStatus(raw);
  const confirmed = normalised.includes("fechado");
  const candidate = normalised.includes("candidato");
  const required = normalised.includes("obrig");
  const planned = normalised.includes("plane");
  const tone = confirmed ? "confirmed" : candidate ? "candidate" : required ? "required" : planned ? "open" : (row.state?.tone || row.accommodation?.tone || "open");
  const label = confirmed ? "Fechado" : candidate ? "Candidato" : required ? "Obrigatório" : planned ? "Planeado" : (hasValue(raw) ? raw : "A validar");
  const statusIcon = confirmed ? "ri-checkbox-circle-line" : candidate ? "ri-time-line" : required ? "ri-error-warning-line" : planned ? "ri-calendar-check-line" : (row.state?.icon || "ri-information-line");
  return { label, tone, icon: statusIcon };
};

const formatDistanceNumber = new Intl.NumberFormat("pt-PT", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const formatMoneyNumber = new Intl.NumberFormat("pt-PT", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const formatDistance = (value) => typeof value === "number" && Number.isFinite(value) ? `~${formatDistanceNumber.format(value)} km` : "";
const renderDistance = (row) => {
  const distance = typeof row.distanceKmGps === "number" ? row.distanceKmGps : (typeof row.distance?.km === "number" ? row.distance.km : null);
  if (distance !== null) return `${formatDistance(distance)}${row.distanceQualifier ? ` ${escapeHtml(row.distanceQualifier)}` : ""}`;
  return hasValue(row.distance) && typeof row.distance !== "object" ? escapeHtml(row.distance) : "";
};
const formatMoney = (value, currency = "€") => typeof value === "number" && Number.isFinite(value) ? `${formatMoneyNumber.format(value)} ${currency}` : escapeHtml(value);
const formatBudgetRange = (min, max, currency) => {
  if (!Number.isFinite(min) || !Number.isFinite(max)) return "A validar";
  return min === max ? formatMoney(min, currency) : `${formatMoneyNumber.format(min)}–${formatMoneyNumber.format(max)} ${currency}`;
};
const formatDuration = (duration) => {
  if (!duration || !Number.isFinite(duration.walkingMinutes)) return "";
  const hours = Math.floor(duration.walkingMinutes / 60);
  const minutes = duration.walkingMinutes % 60;
  return `${hours}h${minutes ? String(minutes).padStart(2, "0") : ""}`;
};
const formatElevation = (elevation) => {
  if (!elevation) return "";
  const parts = [];
  if (Number.isFinite(elevation.gainM)) parts.push(`↑ ${elevation.gainM} m`);
  if (Number.isFinite(elevation.lossM)) parts.push(`↓ ${elevation.lossM} m`);
  if (!parts.length && Array.isArray(elevation.profilePoints) && elevation.profilePoints.length) parts.push(`Perfil oficial · ${elevation.profilePoints.length} pontos`);
  return parts.join(" · ");
};

const findPlace = (name, places = []) => asArray(places).find((place) => place.name === name);
const placeCoords = (place) => isCoordinate(place?.coords) ? place.coords : (Number.isFinite(place?.lat) && Number.isFinite(place?.lng) ? [place.lat, place.lng] : null);
const findPlaceCoords = (name, places) => placeCoords(findPlace(name, places));
const nearestPathPoint = (path, coords) => path.reduce((nearest, point, index) => {
  const distance = (point[0] - coords[0]) ** 2 + (point[1] - coords[1]) ** 2;
  return distance < nearest.distance ? { index, distance } : nearest;
}, { index: 0, distance: Infinity });
const sliceOfficialPaths = (paths, fromName, toName, places) => {
  const fromCoords = findPlaceCoords(fromName, places);
  const toCoords = findPlaceCoords(toName, places);
  if (!paths.length || !fromCoords || !toCoords) return paths;
  const start = paths.map((path, pathIndex) => ({ pathIndex, ...nearestPathPoint(path, fromCoords) })).sort((a, b) => a.distance - b.distance)[0];
  const end = paths.map((path, pathIndex) => ({ pathIndex, ...nearestPathPoint(path, toCoords) })).sort((a, b) => a.distance - b.distance)[0];
  if (start.pathIndex === end.pathIndex) {
    const [first, last] = start.index <= end.index ? [start.index, end.index] : [end.index, start.index];
    const slice = paths[start.pathIndex].slice(first, last + 1);
    return start.index <= end.index ? [slice] : [slice.reverse()];
  }
  if (start.pathIndex > end.pathIndex) return paths;
  const sliced = [paths[start.pathIndex].slice(start.index)];
  for (let pathIndex = start.pathIndex + 1; pathIndex < end.pathIndex; pathIndex += 1) sliced.push(paths[pathIndex]);
  sliced.push(paths[end.pathIndex].slice(0, end.index + 1));
  return sliced;
};
const getStagePaths = (row, data) => {
  const mapConfig = data.map;
  const detail = row.detail;
  return asArray(detail.officialSegments).flatMap((segment) => {
    const allPaths = asArray(mapConfig.officialRoute?.paths?.[segment.id]);
    const paths = Array.isArray(segment.pathIndexes) ? segment.pathIndexes.map((pathIndex) => allPaths[pathIndex]).filter(Boolean) : allPaths;
    return segment.from && segment.to ? sliceOfficialPaths(paths, segment.from, segment.to, mapConfig.places || []) : paths;
  });
};
const getMainOfficialPaths = (mapConfig) => asArray(mapConfig.officialRoute?.stageFolders).flatMap((name) => asArray(mapConfig.officialRoute?.paths?.[name]));

const renderDetailItem = (label, value, iconName, tone = "") => {
  if (!hasValue(value)) return "";
  return `<div class="detail-item${tone ? ` detail-item-${safeClass(tone)}` : ""}"><span class="detail-label">${icon(iconName || "ri-information-line")}<span>${escapeHtml(label)}</span></span><strong>${escapeHtml(value)}</strong></div>`;
};
const renderMetaPair = (label, value) => hasValue(value) ? `<div class="meta-pair"><strong>${escapeHtml(label)}</strong><span>${escapeHtml(value)}</span></div>` : "";
const getHttpUrl = (value) => /^https?:\/\//i.test(String(value || "")) ? String(value) : "";
const renderExternalLink = (href, label, iconName = "ri-external-link-line") => {
  const safeHref = getHttpUrl(href);
  return safeHref ? `<a class="detail-link" href="${escapeHtml(safeHref)}" target="_blank" rel="noreferrer">${icon(iconName)}<span>${escapeHtml(label)}</span></a>` : "";
};

const renderAccommodation = (row, data) => {
  const labels = data.ui.detailLabels;
  const accommodation = row.accommodation;
  const price = row.detail?.accommodationPrice;
  const link = row.detail?.accommodationLink || "";
  const status = statusInfo(row, accommodation.status);
  const address = accommodation.address;
  const checkIn = accommodation.checkIn;
  const phone = accommodation.phone;
  const reference = accommodation.reservationReference;
  const mapLink = accommodation.mapsUrl;
  const meta = [
    renderMetaPair("Morada", address),
    renderMetaPair("Check-in", checkIn),
    renderMetaPair("Telefone", phone),
    renderMetaPair("Reserva", reference)
  ].join("");
  const actions = [renderExternalLink(mapLink, labels.openMap, "ri-map-pin-line"), renderExternalLink(link, labels.link)].filter(Boolean).join("");
  return `<section class="detail-accommodation" aria-labelledby="accommodation-${safeClass(row.dayLabel || row.date)}"><div class="detail-accommodation-head"><span class="detail-section-label">${icon("ri-hotel-bed-line")}<span>${escapeHtml(labels.accommodation)}</span></span><span class="detail-accommodation-status ${safeClass(status.tone)}">${icon(status.icon)}<span>${escapeHtml(status.label)}</span></span></div><div class="detail-accommodation-main"><div class="detail-accommodation-copy"><strong id="accommodation-${safeClass(row.dayLabel || row.date)}">${escapeHtml(accommodation.title || "")}</strong><span>${escapeHtml(accommodation.detail || "")}</span></div>${hasValue(price) ? `<div class="detail-price"><span class="detail-label">${icon("ri-money-euro-circle-line")}<span>${escapeHtml(labels.price)}</span></span><strong>${escapeHtml(typeof price === "number" ? formatMoney(price) : price)}</strong></div>` : ""}</div>${meta ? `<div class="meta-pairs">${meta}</div>` : ""}${actions ? `<div class="detail-accommodation-actions">${actions}</div>` : ""}</section>`;
};

const renderNotes = (notes) => notes ? `${notes.lead ? `<strong>${escapeHtml(notes.lead)}</strong> ` : ""}${escapeHtml(notes.detail || "")}` : "";
const renderTimeline = (items, labels) => {
  if (!Array.isArray(items) || !items.length) return "";
  return `<section class="detail-section"><h3 class="detail-section-label detail-section-title">${icon("ri-time-line")}<span>${escapeHtml(labels.timeline)}</span></h3><ol class="timeline">${items.map((item) => `<li class="timeline-item"><span class="timeline-time">${escapeHtml(item.time)}</span><span><span class="timeline-place">${escapeHtml(item.place || "")}</span>${item.label ? `<span class="timeline-label"> · ${escapeHtml(item.label)}</span>` : ""}</span></li>`).join("")}</ol></section>`;
};
const renderWarnings = (items, labels) => {
  if (!Array.isArray(items) || !items.length) return "";
  return `<section class="detail-section"><h3 class="detail-section-label detail-section-title">${icon("ri-alert-line")}<span>${escapeHtml(labels.warnings)}</span></h3><ul class="warning-list">${items.map((item) => `<li class="warning ${safeClass(item.severity || "medium")}">${icon(item.severity === "low" ? "ri-information-line" : "ri-alert-line")}<span>${escapeHtml(item.text || item.label || item)}</span></li>`).join("")}</ul></section>`;
};

};

const renderElevationProfile = (elevation, labels) => {

const calculateBudget = (budget) => asArray(budget?.categories).reduce((total, category) => {
  const multiplier = toFiniteNumber(category.multiplier) ?? 1;
  const categoryMin = toFiniteNumber(category.min);
  const categoryMax = toFiniteNumber(category.max);
  if (categoryMin === null || categoryMax === null || multiplier < 0) return { ...total, valid: false };
  const min = categoryMin * multiplier;
  const max = categoryMax * multiplier;
  return { min: total.min + min, max: total.max + max, valid: total.valid };
}, { min: 0, max: 0, valid: true });
const getBudget = (data) => data.support.budget;
const renderBudget = (budget) => asArray(budget.categories).map((category) => {
  const multiplier = toFiniteNumber(category.multiplier) ?? 1;
  const categoryMin = toFiniteNumber(category.min);
  const categoryMax = toFiniteNumber(category.max);
  const min = categoryMin === null ? null : categoryMin * multiplier;
  const max = categoryMax === null ? null : categoryMax * multiplier;
  const total = formatBudgetRange(min, max, budget.currency || "€");
  const basis = category.unitLabel ? `${formatBudgetRange(categoryMin, categoryMax, budget.currency || "€")} ${category.unitLabel}${multiplier > 1 ? ` × ${category.multiplierLabel || multiplier}` : ""}` : "";
  return `<li class="budget-row"><span>${escapeHtml(category.label || "")}${basis ? `<small>${escapeHtml(basis)}</small>` : ""}</span><strong>${escapeHtml(total)}</strong></li>`;
}).join("");

const createMap = (mapElement, places, mapConfig, routePaths = []) => {
  const mapPlaces = asArray(places);
  if (!mapElement) return null;
  if (!window.L || (!mapPlaces.length && !routePaths.length)) {
    mapElement.innerHTML = `<span class="map-empty">Mapa indisponível</span>`;
    mapElement.removeAttribute("aria-busy");
    return null;
  }
  mapElement.replaceChildren();
  mapElement.removeAttribute("aria-busy");
  const map = L.map(mapElement, { scrollWheelZoom: false, attributionControl: true, preferCanvas: true });
  const provider = mapConfig.provider || {};
  if (provider.tileUrl) L.tileLayer(provider.tileUrl, { maxZoom: provider.maxZoom || 19, attribution: provider.attribution || "" }).addTo(map);
  const paths = (routePaths.length ? routePaths : (mapPlaces.length > 1 ? [mapPlaces.map(placeCoords).filter(Boolean)] : []))
    .map((path) => Array.isArray(path) ? path.filter(isCoordinate) : [])
    .filter((path) => path.length > 1);
  const pathLayers = paths.map((path) => L.polyline(path, { color: "#0c593f", weight: 4, opacity: .9 }).addTo(map));
  const markerLayers = mapPlaces.map((place) => {
    const coords = placeCoords(place);
    if (!coords) return null;
    return L.circleMarker(coords, { radius: 6, color: "#fff", weight: 2, fillColor: "#0c593f", fillOpacity: 1 }).addTo(map).bindPopup(`<strong>${escapeHtml(place.name || "")}</strong>${place.detail ? `<br>${escapeHtml(place.detail)}` : ""}`);
  }).filter(Boolean);
  const layers = [...pathLayers, ...markerLayers];
  const bounds = L.featureGroup(layers).getBounds();
  if (bounds.isValid()) map.fitBounds(bounds, { padding: [20, 20] });
  return map;
};
const initialiseMap = (mapConfig) => {
  overviewMapObserver?.disconnect();
  overviewMapObserver = null;
  if (overviewMap) return overviewMap;
  overviewMap = createMap(document.getElementById("roadbook-map"), mapConfig.places || [], mapConfig, getMainOfficialPaths(mapConfig));
  return overviewMap;
};
const deferOverviewMap = (mapConfig) => {
  const mapElement = document.getElementById("roadbook-map");
  if (!mapElement) return;
  if (!("IntersectionObserver" in window)) {
    initialiseMap(mapConfig);
    return;
  }
  overviewMapObserver = new IntersectionObserver((entries) => {
    if (!entries.some((entry) => entry.isIntersecting)) return;
    overviewMapObserver?.disconnect();
    overviewMapObserver = null;
    initialiseMap(mapConfig);
  }, { rootMargin: "320px 0px" });
  overviewMapObserver.observe(mapElement);
};
const destroyMaps = () => {
  overviewMapObserver?.disconnect();
  overviewMapObserver = null;
  overviewMap?.remove();
  overviewMap = null;
  stageMaps.forEach((map) => map.remove());
  stageMaps.clear();
};
const destroyInteractions = () => {
  interactionController?.abort();
  interactionController = null;
};
const initialiseStageMap = (index, row, data) => {
  if (stageMaps.has(index)) return;
  const detail = row.detail;
  const mapConfig = data.map;
  const places = (detail.mapPoints || []).map((name) => typeof name === "string" ? findPlace(name, mapConfig.places || []) : name).filter(Boolean);
  const map = createMap(document.getElementById(`stage-map-${index}`), places, mapConfig, getStagePaths(row, data));
  if (map) stageMaps.set(index, map);
};

const setRowExpanded = (index, expanded, data, scroll = false) => {
  const rowElement = roadbookElement.querySelector(`.itinerary-row[data-row-index="${index}"]`);
  const detailElement = document.getElementById(`stage-detail-${index}`);
  const toggle = rowElement?.querySelector(".row-toggle");
  if (!rowElement || !detailElement) return;
  rowElement.setAttribute("aria-expanded", String(expanded));
  if (toggle) {
    toggle.setAttribute("aria-expanded", String(expanded));
    toggle.setAttribute("aria-label", `${data.plan.itinerary[index].stage} · ${expanded ? (data.ui?.collapseLabel || "Fechar detalhes") : (data.ui?.expandLabel || "Abrir detalhes")}`);
  }
  detailElement.hidden = !expanded;
  detailElement.setAttribute("aria-hidden", String(!expanded));
  if (expanded) {
    initialiseStageMap(index, data.plan.itinerary[index], data);
    requestAnimationFrame(() => stageMaps.get(index)?.invalidateSize());
    if (scroll) rowElement.scrollIntoView({ block: "start" });
  }
  updateExpandAllControl(data);
};
const updateExpandAllControl = (data) => {
  const control = roadbookElement.querySelector("[data-action='toggle-all']");
  if (!control) return;
  const rows = [...roadbookElement.querySelectorAll(".itinerary-row")];
  const allExpanded = rows.length > 0 && rows.every((row) => row.getAttribute("aria-expanded") === "true");
  const labels = data.ui.detailLabels;
  control.setAttribute("aria-expanded", String(allExpanded));
  const label = control.querySelector("span");
  if (label) label.textContent = allExpanded ? labels.collapseAll : labels.expandAll;
  const controlIcon = control.querySelector("i");
  if (controlIcon) controlIcon.className = allExpanded ? "ri-arrow-up-double-line" : "ri-arrow-down-double-line";
};
const bindRowInteractions = (data) => {
  destroyInteractions();
  interactionController = new AbortController();
  const { signal } = interactionController;
  roadbookElement.addEventListener("click", (event) => {
    const expandAllControl = event.target.closest("[data-action='toggle-all']");
    if (expandAllControl) {
      const expand = expandAllControl.getAttribute("aria-expanded") !== "true";
      data.plan.itinerary.forEach((_, index) => setRowExpanded(index, expand, data));
      return;
    }
    const rowElement = event.target.closest(".itinerary-row");
    if (!rowElement || (event.target.closest("a, button") && !event.target.closest(".row-toggle"))) return;
    const index = Number(rowElement.dataset.rowIndex);
    setRowExpanded(index, rowElement.getAttribute("aria-expanded") !== "true", data);
  }, { signal });
  roadbookElement.addEventListener("keydown", (event) => {
    if (event.key !== "Enter" && event.key !== " ") return;
    const expandAllControl = event.target.closest("[data-action='toggle-all']");
    const rowToggle = event.target.closest(".row-toggle");
    if (!expandAllControl && !rowToggle) return;
    event.preventDefault();
    if (expandAllControl) {
      const expand = expandAllControl.getAttribute("aria-expanded") !== "true";
      data.plan.itinerary.forEach((_, index) => setRowExpanded(index, expand, data));
      return;
    }
    const rowElement = rowToggle.closest(".itinerary-row");
    const index = Number(rowElement.dataset.rowIndex);
    setRowExpanded(index, rowElement.getAttribute("aria-expanded") !== "true", data);
  }, { signal });
  const openHash = () => {
    const hash = window.location.hash.slice(1);
    const target = document.getElementById(hash);
    const row = target?.classList.contains("itinerary-row") ? target : target?.closest(".itinerary-row");
    if (!row) return;
    setRowExpanded(Number(row.dataset.rowIndex), true, data);
  };
  window.addEventListener("hashchange", openHash, { signal });
  openHash();
};

abel)}</strong></div></div></div></section></section>${supportPanels ? `<section class="support-panels" aria-label="Informação adicional">${supportPanels}</section>` : ""}<footer class="roadbook-footer"><span>${escapeHtml(data.meta?.updatedLabel || "")} · ${escapeHtml(data.meta?.sourceLabel || plan.sourceOfTruth || "")}</span><span class="footer-mark">${escapeHtml(data.footer?.closing || "Bom Caminho!")} ${icon(data.footer?.icon || "ri-route-line")}</span></footer>`;

window.addEventListener("beforeprint", () => {
  if (!pageData) return;
  initialiseMap(pageData.map);
  expandedBeforePrint = [...roadbookElement.querySelectorAll(".itinerary-row")].map((row) => row.getAttribute("aria-expanded") === "true");
  pageData.plan.itinerary.forEach((_, index) => setRowExpanded(index, true, pageData));
});
window.addEventListener("afterprint", () => {
  if (!pageData) return;
  expandedBeforePrint.forEach((expanded, index) => setRowExpanded(index, expanded, pageData));
  expandedBeforePrint = [];
});

const validateRoadbook = (data) => {
  if (!data || typeof data !== "object" || Array.isArray(data)) throw new TypeError("O roadbook tem de ser um objecto JSON.");
  const rows = data.plan.itinerary;
  if (!Array.isArray(rows) || !rows.length) throw new TypeError("O roadbook não contém etapas.");
  if (rows.some((row) => !row || typeof row !== "object")) throw new TypeError("Uma ou mais etapas são inválidas.");
  const pathGroups = Object.values(data.map?.officialRoute?.paths || {});
  const hasInvalidPath = pathGroups.some((group) => !Array.isArray(group) || group.some((path) => !Array.isArray(path) || path.some((point) => !isCoordinate(point))));
  if (hasInvalidPath) throw new TypeError("O traçado oficial contém coordenadas inválidas.");
  return data;
};
const renderLoadError = () => {
  roadbookElement.innerHTML = `<section class="load-error" role="alert"><div>${icon("ri-error-warning-line")}</div><h1>Não foi possível abrir o roadbook</h1><p>Confirma que o bloco <code>roadbook-data</code> em <code>index.html</code> contém JSON válido e tenta novamente.</p><button type="button" data-action="retry">${icon("ri-refresh-line")}<span>Tentar novamente</span></button></section>`;
  roadbookElement.querySelector("[data-action='retry']")?.addEventListener("click", loadRoadbook, { once: true });
};
async function loadRoadbook() {
  roadbookElement.setAttribute("aria-busy", "true");
  try {
    const dataElement = document.getElementById("roadbook-data");
    if (!dataElement) throw new Error("Bloco roadbook-data em falta.");
    renderRoadbook(validateRoadbook(JSON.parse(dataElement.textContent)));
  } catch (error) {
    console.error(error);
    destroyMaps();
    destroyInteractions();
    renderLoadError();
  } finally {
    roadbookElement.removeAttribute("aria-busy");
  }
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", loadRoadbook, { once: true });
} else {
  loadRoadbook();
}

  </script>
</body>
